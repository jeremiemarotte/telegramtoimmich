version: "3.8"

services:
  telegram-bot-api:
    container_name: telegram-bot-api
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1" # Nécessaire pour que les fichiers soient servis (sinon 404 au download)
    volumes:
      - ./data/bot-api:/var/lib/telegram-bot-api

  telegram-bot:
    container_name: telegram-bot
    image: ghcr.io/jeremiemarotte/telegramtoimmich:latest
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    volumes:
      - ./data:/tmp # Stockage temporaire des photos + quarantaine des uploads échoués
      - ./data/bot-api:/var/lib/telegram-bot-api:ro # Même volume que telegram-bot-api : requis par le mode local
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      IMMICH_API_URL: ${IMMICH_API_URL}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      IMMICH_ALBUM_ID: ${IMMICH_ALBUM_ID}
